name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa          # CPU rendering on the headless runner
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages for offscreen rendering
        run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fetch the Franka Panda model
        run: python scripts/get_menagerie.py
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
